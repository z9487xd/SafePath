[platformio]
; 只打 pio run 時只編正式版；測試版要加 -e bench_n1n2
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600 在部分 CP2102 板子上燒錄會斷線或 MD5 驗證失敗
upload_speed = 115200
build_flags = -I ${PROJECT_DIR}/../shared
lib_deps =
    fastled/FastLED @ ~3.9.0  ; 3.10.x 在 Arduino-ESP32 2.x 退回通用驅動，時序錯誤導致矩陣全白
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19

; 兩片板子桌上測試：只接 N1、N2，其餘節點視為乾淨走廊（見 hazardFactor）。
; 對 N1 吹煙，N2 的箭頭會由 ← 轉成 ↓。燒錄：pio run -e bench_n1n2 -t upload
[env:bench_n1n2]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D BENCH_LIVE_MASK=0x06

; 同上，但不讀位址跳線，直接當 N1（跳線接觸不良時用）
[env:bench_n1n2_force_n1]
extends = env:bench_n1n2
build_flags = ${env:bench_n1n2.build_flags} -D FORCE_NODE_ID=1
